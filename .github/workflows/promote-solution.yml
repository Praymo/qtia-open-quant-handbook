name: Promote community answer to solution PR
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Legacy answer Issue number (leave empty for Discussion)
        required: false
        type: number
      discussion_number:
        description: Question Discussion number
        required: false
        type: number
      comment_id:
        description: Discussion comment ID (required for Discussion)
        required: false
        type: number
permissions:
  contents: write
  issues: read
  discussions: read
  pull-requests: write
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'promote-to-solution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate solution draft
        run: node scripts/promote-community-answer.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISCUSSION_NUMBER: ${{ inputs.discussion_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
      - run: npm run check && npm run build
      - name: Open review PR when repository policy allows it
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          DISCUSSION_NUMBER: ${{ inputs.discussion_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: |
          if [ -n "$DISCUSSION_NUMBER" ] && [ "$DISCUSSION_NUMBER" != "0" ]; then
            branch="community-solution/discussion-${DISCUSSION_NUMBER}-comment-${COMMENT_ID}"
            source="discussion #${DISCUSSION_NUMBER} comment ${COMMENT_ID}"
          else
            branch="community-solution/issue-${ISSUE_NUMBER}"
            if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "0" ]; then branch="${branch}-comment-${COMMENT_ID}"; fi
            source="issue #${ISSUE_NUMBER}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/solutions
          git commit -m "Draft community solution from ${source}"
          git push origin "$branch"
          if gh pr create --base main --head "$branch" --title "Review community solution from ${source}" --body "Generated from ${source}. Please check the reasoning, formatting and contributor credit before merging."; then
            echo "Review the new solution PR before merging." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The review branch was created, but repository policy blocked automatic PR creation." >> "$GITHUB_STEP_SUMMARY"
            echo "Open a PR from https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi

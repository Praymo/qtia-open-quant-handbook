name: 贴答案或想法
description: 分享解法、问题或补充；成熟的解答可经审核成为正式解答。
labels: [community-answer]
title: "[题号] 解答投稿"
body:
  - type: input
    id: question
    attributes:
      label: 哪道题？
      placeholder: 例如 01.2
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: 你的答案或想法
      description: 思路、问题、Markdown、公式或代码都可以。
      placeholder: 写下你的想法……
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 还有什么想补充？（可不填）
      description: 可以说明假设、参考来源，或希望别人帮你核对的地方。
    validations:
      required: false

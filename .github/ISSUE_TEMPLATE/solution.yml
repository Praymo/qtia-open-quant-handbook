name: 直接贴答案
description: 粘贴答案，维护者会整理成题目下的社区解答。
title: "[题号] 解答投稿"
body:
  - type: input
    id: question
    attributes:
      label: 哪道题？
      placeholder: 例如 01.2
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: 你的答案
      description: 文字、Markdown、公式或代码都可以。
      placeholder: 写下你的思路和结果……
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 还有什么想补充？（可不填）
      description: 可以说明假设、参考来源，或希望别人帮你核对的地方。
    validations:
      required: false

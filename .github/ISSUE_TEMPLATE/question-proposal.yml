name: 分享一道题
description: 粘贴题面和已知出处；维护者负责题号、翻译、分类和排版。
title: "题目投稿："
body:
  - type: textarea
    id: statement
    attributes:
      label: 题目内容
      description: 中文或英文都可以；请写清条件和问题。
      placeholder: 在这里粘贴题面……
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 来源或出处线索（知道的话填）
      description: 例如原帖链接、书名或你从哪里看到的。填写已知信息即可。
    validations:
      required: false
  - type: textarea
    id: note
    attributes:
      label: 补充说明（可不填）
      description: 可以写自己的理解、希望如何署名，或题目中需要确认的条件。
    validations:
      required: false
